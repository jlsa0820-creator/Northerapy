<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sin conexión — Northerapy CRM</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0F172A;
      color: #E2E8F0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .tarjeta {
      max-width: 360px;
      padding: 32px 28px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 16px;
      background: #16213B;
    }
    .icono {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      border: 1px solid rgba(45, 212, 191, 0.3);
      background: rgba(45, 212, 191, 0.1);
      font-size: 28px;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #8FA3BF; }
    a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
      background: #14B8A6;
      color: #04211D;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="tarjeta">
    <div class="icono">📡</div>
    <h1>Sin conexión</h1>
    <p>
      El CRM necesita internet para leer y guardar datos en Supabase.
      Revisa tu conexión (Wi-Fi o datos) y vuelve a intentar.
    </p>
    <a href="/">Reintentar</a>
  </div>
</body>
</html>
